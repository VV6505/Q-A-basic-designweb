<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Trắc nghiệm</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f4f7fb;color:#172033}.app{max-width:940px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-weight:850;font-size:19px}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill,.btn,.select{border-radius:10px;padding:9px 12px;border:1px solid #dbe2ea;background:#fff;font:inherit}.btn{font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.primary{background:#4f46e5;color:#fff;border:0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 8px 30px #0f172a12;padding:28px}.hidden{display:none!important}.start{text-align:center}.start h1{font-size:32px;margin:0 0 10px}.sub,.start p{color:#64748b;line-height:1.6}.settings{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px}.meta{display:flex;justify-content:space-between;color:#64748b;font-size:14px}.progress{height:8px;background:#e8edf5;border-radius:99px;margin:12px 0 24px;overflow:hidden}.bar{height:100%;background:#4f46e5;transition:width .2s}.q{font-size:21px;line-height:1.55;margin:12px 0}.type{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:800}.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:14px;margin:9px 0;cursor:pointer;line-height:1.5}.option:hover:not(.locked){border-color:#818cf8;background:#f8f7ff}.option.picked{border-color:#4f46e5;background:#eef2ff}.option.correct{border-color:#16a34a;background:#f0fdf4}.option.wrong{border-color:#dc2626;background:#fef2f2}.option.locked{cursor:default}.letter{min-width:34px;height:34px;border-radius:10px;background:#eef2ff;display:grid;place-items:center;font-weight:850}.tag{margin-left:auto;font-size:12px;font-weight:800;white-space:nowrap;padding-top:7px}.feedback{margin-top:18px;padding:16px;border-radius:14px;line-height:1.55}.ok{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.explain{margin-top:12px;padding:12px;border-radius:10px;background:#ffffffcc;color:#334155}.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:22px}.dot{border:0;border-radius:8px;padding:8px 2px;cursor:pointer}.done{background:#dcfce7;color:#166534}.wrongdot{background:#fee2e2;color:#991b1b}.pending{background:#fef3c7;color:#92400e}.review{margin-top:24px;text-align:left}.review-item{padding:15px;border:1px solid #e2e8f0;border-radius:14px;margin:9px 0;line-height:1.55}.score{font-size:54px;font-weight:900}.error{color:#991b1b;background:#fef2f2;border:1px solid #fecaca;padding:16px;border-radius:12px}.center{text-align:center}@media(max-width:640px){.card{padding:20px}.q{font-size:19px}.grid{grid-template-columns:repeat(8,1fr)}.top{align-items:flex-start;flex-direction:column}}</style></head>
<body><div class="app">
<div class="top"><div class="brand">📝 Quiz Trắc nghiệm</div><div class="actions"><button id="back" class="btn" onclick="back()" disabled>← Quay lại</button><button class="btn" onclick="exitQuiz()">Thoát</button><div id="scorePill" class="pill">Điểm: 0</div></div></div>

<div id="loading" class="card">Đang tải <b>questions.json</b>...</div>

<div id="start" class="card start hidden"><h1>Bắt đầu làm bài</h1><p id="info"></p>
<div class="settings"><label>Số câu <select id="count" class="select"></select></label><label>Thứ tự <select id="order" class="select"><option value="original">Theo tài liệu</option><option value="random">Trộn câu hỏi</option></select></label></div>
<button class="btn primary" onclick="startQuiz()">Bắt đầu →</button>
<p>1 điểm/câu. Câu nhiều đáp án chỉ đúng khi chọn <b>đúng và đủ</b>.</p></div>

<div id="quiz" class="card hidden"><div class="meta"><span id="counter"></span><span id="now"></span></div><div class="progress"><div id="bar" class="bar"></div></div>
<span id="type" class="type"></span><h2 id="question" class="q"></h2><div id="options"></div>
<div id="feedback"></div>
<div class="foot"><button id="checkBtn" class="btn primary hidden" onclick="check()">Chấm đáp án</button><button id="next" class="btn primary hidden" onclick="next()">Câu tiếp theo →</button></div></div>

<div id="result" class="card hidden"><div class="center"><h1>🎉 Hoàn thành!</h1><div id="final" class="score"></div><div id="summary" class="sub"></div></div>
<div class="foot"><button class="btn" onclick="review(false)">Xem lại tất cả</button><button class="btn" onclick="review(true)">Chỉ xem câu sai</button><button class="btn primary" onclick="location.reload()">Làm lại</button></div>
<div id="grid" class="grid"></div><div id="review" class="review"></div></div>
</div>
<script>
let BANK=[],quiz=[],i=0,score=0,res=[];
const $=x=>document.getElementById(x), L=n=>String.fromCharCode(65+n);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const isMulti=q=>q.type==="multiple"||Array.isArray(q.answers);
const correctOf=q=>(isMulti(q)?q.answers:[q.answer]).map(Number).sort((a,b)=>a-b);
const explainHTML=q=>q.explanation&&q.explanation.trim()?`<div class="explain"><b>📖 Giải thích:</b><br>${esc(q.explanation)}</div>`:`<div class="explain"><b>📖 Giải thích:</b> chưa có trong tài liệu.</div>`;
const listHTML=(q,arr)=>arr.length?arr.map(n=>`${L(n)}. ${esc(q.options[n])}`).join("<br>"):"Chưa chọn";

async function load(){try{
  const r=await fetch("questions.json",{cache:"no-store"});if(!r.ok)throw Error("Không đọc được questions.json");
  const d=await r.json();BANK=Array.isArray(d)?d:d.questions;if(!BANK?.length)throw Error("Danh sách câu hỏi trống.");
  $("loading").classList.add("hidden");$("start").classList.remove("hidden");
  $("info").innerHTML=`Có <b>${BANK.length} câu</b>. Câu 1 đáp án chấm ngay khi chọn; câu nhiều đáp án bấm <b>Chấm đáp án</b>. Sau mỗi câu có đáp án đúng và giải thích.`;
  [BANK.length,100,50,20].filter((v,j,a)=>v<=BANK.length&&a.indexOf(v)===j).forEach(v=>$("count").add(new Option(v==BANK.length?`Tất cả ${v} câu`:`${v} câu`,v)));
}catch(e){$("loading").innerHTML=`<div class="error"><b>Không thể tải questions.json.</b><br>${esc(e.message)}<br>Đặt hai file cùng thư mục và chạy bằng Live Server/GitHub Pages (không mở trực tiếp file://).</div>`}}

function shuffle(a){a=[...a];for(let j=a.length-1;j;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function startQuiz(){quiz=($("order").value=="random"?shuffle(BANK):[...BANK]).slice(0,+$("count").value);i=0;score=0;res=quiz.map(()=>({selected:[],answered:false,correct:false}));$("start").classList.add("hidden");$("quiz").classList.remove("hidden");render()}

function render(){
  const q=quiz[i],r=res[i],multi=isMulti(q),right=correctOf(q);
  $("counter").textContent=`Câu ${i+1}/${quiz.length} • ID ${q.id}`;
  $("now").textContent=$("scorePill").textContent=`Điểm: ${score}`;
  $("bar").style.width=((i+1)/quiz.length*100)+"%";
  $("type").textContent=multi?"☑ Nhiều đáp án — chọn đúng và đủ":"◉ Một đáp án";
  $("question").textContent=q.question;
  const box=$("options");box.innerHTML="";
  q.options.forEach((o,n)=>{
    const b=document.createElement("button");b.className="option";
    const sel=r.selected.includes(n);
    b.innerHTML=`<span class="letter">${L(n)}</span><span>${esc(o)}</span>`;
    if(r.answered){
      b.classList.add("locked");
      const ok=right.includes(n);
      if(ok)b.classList.add("correct");else if(sel)b.classList.add("wrong");
      const t=ok?(sel?"✔ Bạn chọn đúng":"✔ Đáp án đúng"):(sel?"✖ Bạn chọn":"");
      if(t)b.insertAdjacentHTML("beforeend",`<span class="tag">${t}</span>`);
    }else{
      if(sel)b.classList.add("picked");
      b.onclick=()=>{if(multi){r.selected=sel?r.selected.filter(x=>x!==n):[...r.selected,n].sort((a,b)=>a-b);render()}else{r.selected=[n];check()}};
    }
    box.append(b);
  });
  $("checkBtn").classList.toggle("hidden",!multi||r.answered);
  $("next").classList.toggle("hidden",!r.answered);
  $("next").textContent=i===quiz.length-1?"Xem kết quả →":"Câu tiếp theo →";
  $("back").disabled=i===0;
  $("feedback").innerHTML="";
  if(r.answered)showFeedback(q,r,right);
}
function check(){
  const q=quiz[i],r=res[i];if(r.answered)return;
  if(!r.selected.length){$("feedback").innerHTML=`<div class="feedback bad"><b>Chưa chọn đáp án.</b></div>`;return}
  const a=correctOf(q),b=[...r.selected].sort((x,y)=>x-y);
  r.correct=a.length===b.length&&a.every((v,k)=>v===b[k]);r.answered=true;if(r.correct)score++;render();
}
function showFeedback(q,r,right){
  $("feedback").innerHTML=`<div class="feedback ${r.correct?"ok":"bad"}"><b>${r.correct?"✅ Đúng":"❌ Sai"}</b>
  <div style="margin-top:8px"><b>Bạn chọn:</b><br>${listHTML(q,r.selected)}</div>
  <div style="margin-top:8px"><b>Đáp án đúng:</b><br>${listHTML(q,right)}</div>${explainHTML(q)}</div>`;
}
function next(){i<quiz.length-1?(i++,render()):finish()}
function back(){if(i){i--;render()}}
function finish(){
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("review").innerHTML="";
  const p=Math.round(score/quiz.length*100),skipped=res.filter(r=>!r.answered).length;
  $("final").textContent=`${score}/${quiz.length}`;
  $("summary").innerHTML=`Đúng <b>${score}</b> • Sai <b>${quiz.length-score-skipped}</b>${skipped?` • Chưa làm <b>${skipped}</b>`:""} • <b>${p}%</b>`;
  const g=$("grid");g.innerHTML="";
  res.forEach((r,n)=>{const b=document.createElement("button");b.className="dot "+(r.answered?(r.correct?"done":"wrongdot"):"pending");b.textContent=n+1;b.onclick=()=>{i=n;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()};g.append(b)});
}
function review(onlyWrong){
  let out="";
  res.forEach((r,n)=>{if(onlyWrong&&r.correct)return;const q=quiz[n];
    out+=`<div class="review-item"><b>Câu ${n+1} (ID ${q.id}) — ${r.answered?(r.correct?"✅ Đúng":"❌ Sai"):"⏳ Chưa làm"}</b>
    <div style="margin-top:7px">${esc(q.question)}</div>
    <p><b>Bạn chọn:</b><br>${listHTML(q,r.selected)}</p>
    <p><b>Đáp án đúng:</b><br>${listHTML(q,correctOf(q))}</p>${explainHTML(q)}</div>`});
  $("review").innerHTML=out||`<p class="center sub">Không có câu nào để hiển thị 🎯</p>`;
  $("review").scrollIntoView({behavior:"smooth"});
}
function exitQuiz(){if(confirm("Thoát bài làm? Tiến độ hiện tại sẽ mất."))location.reload()}
load();
</script></body></html>
